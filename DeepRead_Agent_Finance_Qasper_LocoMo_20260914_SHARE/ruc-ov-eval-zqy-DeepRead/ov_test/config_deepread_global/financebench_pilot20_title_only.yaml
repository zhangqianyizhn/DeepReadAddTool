project_name: "RAG_Benchmark"
dataset_name: "FinanceBenchPilot20"

adapter:
  module: "src.adapters.finance_bench_adapter"
  class_name: "FinanceBenchAdapter"

store:
  type: "DeepRead"
  enable_vector: true
  enable_hybrid: false
  enable_semantic: false
  neighbor_window: "1,-1"
  max_rounds: 50
  use_pymupdf: true
  source_header_enabled: true
  enable_session_pagination: false
  preload_directory_structure: false
  enable_document_title_search: true
  enable_structure_title_search: false
  agent_topk_max: 1
  pagination_candidate_limit: 1
  embedding_api_key: "${EMBEDDING_API_KEY}"
  embedding_base_url: "${EMBEDDING_BASE_URL}"
  embedding_model: "${EMBEDDING_MODEL_NAME}"

execution:
  max_workers: 1
  ingest_workers: 1
  retrieval_topk: 1
  max_queries: 20
  skip_ingestion: true

paths:
  raw_data: "agentic_rag_self_learning/data/generated/pilot20/data/financebench_open_source.jsonl"
  doc_output_dir: "agentic_rag_self_learning/data/generated/pilot20/DeepRead/processed_docs"
  vector_store: "agentic_rag_self_learning/data/generated/pilot20/DeepRead/store_index"
  output_dir: "ExperimentArtifacts/FinanceBenchPilot20/Output/deepread_title_only_20"

llm:
  model: "${LLM_MODEL}"
  temperature: 0
  base_url: "${LLM_BASE_URL}"
  api_key: "${LLM_API_KEY}"
